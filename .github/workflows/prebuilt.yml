name: build-prebuilt

# Builds prebuilt/<os>_<arch>/libocr_rs_combined.a for every supported target
# and uploads them as workflow artifacts. Manual trigger only.
on:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Linux: build inside an Ubuntu 18.04 docker container so the resulting
  # archive only needs glibc 2.27 at runtime.
  #
  # We deliberately do NOT use the workflow's `container:` field, because the
  # runner injects a node20 binary that requires GLIBC_2.28 — which 18.04
  # does not have. Instead, keep all GitHub action helpers (checkout,
  # upload-artifact) on the host runner, and only the cargo build runs in
  # the ubuntu:18.04 container.
  # ---------------------------------------------------------------------------
  linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build inside ubuntu:18.04
        run: |
          set -eux
          docker run --rm \
            -v "$PWD":/work -w /work \
            -e DEBIAN_FRONTEND=noninteractive \
            ubuntu:18.04 bash -c '
              set -eux
              apt-get update
              apt-get install -y --no-install-recommends \
                  ca-certificates curl git build-essential pkg-config \
                  software-properties-common gnupg \
                  clang libclang-dev \
                  ocl-icd-opencl-dev libvulkan-dev
              # cmake >= 3.18 from Kitware (default 18.04 cmake is 3.10)
              curl -fsSL https://apt.kitware.com/keys/kitware-archive-latest.asc \
                  | gpg --dearmor -o /usr/share/keyrings/kitware-archive.gpg
              echo "deb [signed-by=/usr/share/keyrings/kitware-archive.gpg] https://apt.kitware.com/ubuntu/ bionic main" \
                  > /etc/apt/sources.list.d/kitware.list
              apt-get update
              apt-get install -y --no-install-recommends cmake
              # gcc-8 for C++17 in MNN (default 18.04 gcc is 7)
              add-apt-repository -y ppa:ubuntu-toolchain-r/test
              apt-get update
              apt-get install -y --no-install-recommends gcc-8 g++-8
              update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-8 80 \
                  --slave /usr/bin/g++ g++ /usr/bin/g++-8
              # rustup
              curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
              export PATH="$HOME/.cargo/bin:$PATH"
              bash scripts/build_linux.sh
            '
      - uses: actions/upload-artifact@v4
        with:
          name: prebuilt-linux_amd64
          path: prebuilt/linux_amd64/libocr_rs_combined.a

  # ---------------------------------------------------------------------------
  # macOS: build both Intel and Apple-silicon variants on macos-14 (arm host).
  #
  # The `ocr-rs` crate also builds a side cdylib (which we do not consume) and
  # that cdylib's link line includes `-lvulkan`. Vulkan is not native on
  # macOS; Homebrew's vulkan-loader / molten-vk satisfy it at build time.
  # ---------------------------------------------------------------------------
  macos:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            goarch: amd64
          - target: aarch64-apple-darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan loader (build-time only)
        run: |
          brew update --quiet
          brew install vulkan-headers vulkan-loader molten-vk
          brew_prefix="$(brew --prefix)"
          echo "LIBRARY_PATH=${brew_prefix}/lib:${LIBRARY_PATH:-}" >> $GITHUB_ENV
          echo "CPATH=${brew_prefix}/include:${CPATH:-}" >> $GITHUB_ENV
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}
      - name: Build
        env:
          OCRRS_TARGET: ${{ matrix.target }}
        run: bash scripts/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: prebuilt-darwin_${{ matrix.goarch }}
          path: prebuilt/darwin_${{ matrix.goarch }}/libocr_rs_combined.a

  # ---------------------------------------------------------------------------
  # Windows: x86_64-pc-windows-msvc.
  #
  # ocr-rs's build.rs hard-codes a "NMake Makefiles" CMake generator and
  # MSVC-only /MT/MD flags, so the MinGW path is not viable. We go MSVC
  # end-to-end: vcvars set up via ilammy/msvc-dev-cmd, Vulkan SDK from
  # LunarG (provides vulkan-1.lib + headers), OpenCL.lib from vcpkg.
  # ocr-rs emits `cargo:rustc-link-lib=vulkan`, but the LunarG SDK ships
  # the lib as vulkan-1.lib, so we add a vulkan.lib alias.
  # ---------------------------------------------------------------------------
  windows-amd64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          choco install vulkan-sdk -y --no-progress
          $vulkanRoot = (Get-ChildItem "C:\VulkanSDK" | Sort-Object Name -Descending | Select-Object -First 1).FullName
          # ocr-rs's build.rs emits `cargo:rustc-link-lib=vulkan`, but LunarG
          # ships the import lib as vulkan-1.lib. Alias it so link.exe finds
          # the expected name.
          Copy-Item "$vulkanRoot\Lib\vulkan-1.lib" "$vulkanRoot\Lib\vulkan.lib" -Force
          "VULKAN_SDK=$vulkanRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LIB=$vulkanRoot\Lib;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "INCLUDE=$vulkanRoot\Include;$env:INCLUDE" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install OpenCL via vcpkg
        shell: pwsh
        run: |
          vcpkg install opencl:x64-windows
          $ocl_lib = "C:\vcpkg\installed\x64-windows\lib"
          $ocl_inc = "C:\vcpkg\installed\x64-windows\include"
          "LIB=$ocl_lib;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "INCLUDE=$ocl_inc;$env:INCLUDE" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install Rust toolchain (msvc)
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
          rustup default stable-x86_64-pc-windows-msvc
          rustup target add x86_64-pc-windows-msvc
      - name: Build
        shell: pwsh
        run: scripts/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: prebuilt-windows_amd64
          path: prebuilt/windows_amd64/ocr_rs_combined.lib

  # ---------------------------------------------------------------------------
  # Optional: collect all artifacts and (re)publish a single archive.
  # ---------------------------------------------------------------------------
  bundle:
    needs: [linux-amd64, macos, windows-amd64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: prebuilt-*
          path: prebuilt-dl
      - name: Lay out into prebuilt/
        run: |
          set -eux
          for d in prebuilt-dl/prebuilt-*; do
              name="${d##*/prebuilt-}"
              mkdir -p "prebuilt/$name"
              # Each artifact dir contains a single libocr_rs_combined.a
              # (.lib on Windows). Copy whatever is in it.
              cp "$d"/* "prebuilt/$name/"
          done
          ls -la prebuilt/*/
      - uses: actions/upload-artifact@v4
        with:
          name: prebuilt-all
          path: |
            prebuilt/**/libocr_rs_combined.a
            prebuilt/**/ocr_rs_combined.lib
