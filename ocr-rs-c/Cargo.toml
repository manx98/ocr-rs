[package]
name = "ocr-rs-c"
version = "0.1.0"
edition = "2021"
description = "Minimal C ABI shim around the ocr-rs crate, used by the Go bindings."
license = "Apache-2.0"

[lib]
name = "ocr_rs_c"
crate-type = ["staticlib"]

[dependencies]
ocr-rs = { version = "2.2", features = ["build-mnn-from-source"] }
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
libc = "0.2"
